      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(contains(github.event.head_commit.message, '[e4-join-key-calibration-once]') && '["ordinary-1"]' || (contains(github.event.head_commit.message, '[e4-canonical-cost-once]') || contains(github.event.head_commit.message, '[e4-canonical-first32-once]') || contains(github.event.head_commit.message, '[e4-shared-guard-once]') || contains(github.event.head_commit.message, '[e4-join-key-once]')) && '["maximum"]' || '["ordinary-1","ordinary-100","ordinary-500","maximum","lock-contention","failure-retry"]') }}
    env:
      APP_ENV: test
      SRVF_E4_DIAGNOSTIC_PURPOSE: DIAGNOSTIC_ONLY
      SRVF_E4_DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
      SRVF_E4_CANONICAL_COST_ONLY: ${{ contains(github.event.head_commit.message, '[e4-canonical-cost-once]') && '1' || '' }}
      SRVF_E4_CANONICAL_JIT_ABBA: ${{ contains(github.event.head_commit.message, '[e4-canonical-jit-once]') && '1' || '' }}
      SRVF_E4_CANONICAL_MEMORY_PAIR: ${{ contains(github.event.head_commit.message, '[e4-canonical-memory-once]') && '1' || '' }}
      SRVF_E4_CANONICAL_FIRST32: ${{ (contains(github.event.head_commit.message, '[e4-canonical-first32-once]') || contains(github.event.head_commit.message, '[e4-shared-guard-once]') || contains(github.event.head_commit.message, '[e4-join-key-once]')) && '1' || '' }}
      SRVF_E4_JOIN_KEY_ONCE: ${{ contains(github.event.head_commit.message, '[e4-join-key-once]') && '1' || '' }}
      SRVF_E4_JOIN_KEY_CALIBRATION: ${{ contains(github.event.head_commit.message, '[e4-join-key-calibration-once]') && '1' || '' }}
      SRVF_E4_SHARED_GUARD_ONCE: ${{ contains(github.event.head_commit.message, '[e4-shared-guard-once]') && '1' || '' }}
      SRVF_E4_GITHUB_ISOLATED: '1'
      SRVF_TEST_RUN_SCOPE: app_test_w98
      SRVF_E4_W98: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Offline calibration boundary tests
        if: contains(github.event.head_commit.message, '[e4-join-key-calibration-once]')
        run: pnpm exec jest --config test/jest-unit.config.ts --runInBand --no-cache --runTestsByPath test/helpers/e4-prepare-cost-diagnostic.spec.ts test/helpers/e4-diagnostic-limits-client.spec.ts --testRegex 'test/helpers/(e4-prepare-cost-diagnostic|e4-diagnostic-limits-client)\.spec\.ts$'
      - name: Start fresh PostgreSQL 16 runner
        run: |
          docker compose up -d postgres
          for attempt in $(seq 1 60); do
            if docker exec u-nest-api-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Prove fixed metadata bytes and hashes before fixture construction
        if: contains(github.event.head_commit.message, '[e4-join-key-calibration-once]')
        env:
          TS_NODE_PROJECT: test/tsconfig.test.json
        run: pnpm exec ts-node test/diagnostics/e4-prepare-cost.diagnostic-spec.ts --canonical-equivalence
      - name: One fixed scenario, current143, original later budgets and independent 600s watchdog
        env:
          TS_NODE_PROJECT: test/tsconfig.test.json
        run: pnpm exec ts-node test/diagnostics/e4-prepare-cost.diagnostic-spec.ts --execute
      - name: Summarize closed shared-guard evidence
        if: always() && (contains(github.event.head_commit.message, '[e4-join-key-calibration-once]') || contains(github.event.head_commit.message, '[e4-shared-guard-once]') || contains(github.event.head_commit.message, '[e4-join-key-once]'))
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tmp/e4-prepare-cost-evidence/result.json';
          if (!fs.existsSync(file) || fs.statSync(file).size > 65536) throw Error('E4 closed evidence unavailable');
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (r.head !== process.env.GITHUB_SHA || r.run !== process.env.GITHUB_RUN_ID || r.scenario !== process.env.SRVF_E4_DIAGNOSTIC_SCENARIO || r.purpose !== 'DIAGNOSTIC_ONLY') throw Error('E4 closed evidence binding refused');
          process.stdout.write('E4_SHARED_GUARD_RESULT ' + JSON.stringify({ head:r.head, run:r.run, status:r.status, coverage:r.coverage, migration:r.migration, oracle:r.oracle, scenario:r.scenario, scenarioShape:r.scenarioShape, facts:r.facts, limits:r.limits, sourceBuildMs:r.sourceBuildMs, prepareMs:r.prepareMs, oracleMs:r.oracleMs, stages:r.stages, phase:r.phase, oracleTransactions:r.oracleTransactions, resources:r.resources, databaseCleanup:r.databaseCleanup, independentCleanup:r.independentCleanup, firstCanonical32:r.firstCanonical32, internalSqlPlan:r.internalSqlPlan, internal:r.internal, joinKeyCandidate:r.joinKeyCandidate, joinKeyPostFailureOracle:r.joinKeyPostFailureOracle, joinKeyVerificationError:r.joinKeyVerificationError, errorSubstage:r.errorSubstage, error:r.error }) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-prepare-cost-${{ github.run_id }}-${{ matrix.scenario }}
          path: tmp/e4-prepare-cost-evidence/result.json
          if-no-files-found: error
      - name: Remove this job's ephemeral PostgreSQL container
        if: always()
        run: docker compose down
