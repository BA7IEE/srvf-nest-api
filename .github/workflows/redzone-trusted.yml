name: Red-zone (trusted)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: redzone-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Security boundary: checkout base only, never install dependencies or run PR code.
jobs:
  scan:
    name: Red-zone trusted scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.judge.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Judge against BASE registry
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/workflows/redzone-trusted-judge.mjs
  approval:
    name: Red-zone trusted approval
    needs: scan
    if: needs.scan.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: harness-review
    steps:
      - run: echo "Maintainer approved protected changes."
  verdict:
    name: Red-zone (trusted)
    needs: [scan, approval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate (fail closed)
        env:
          SCAN: ${{ needs.scan.result }}
          REQUIRED: ${{ needs.scan.outputs.required }}
          APPROVAL: ${{ needs.approval.result }}
        run: |
          test "$SCAN" = success
          case "$REQUIRED:$APPROVAL" in
            false:skipped|true:success) exit 0 ;;
            *) echo "::error::Missing scan verdict or maintainer approval"; exit 1 ;;
          esac
