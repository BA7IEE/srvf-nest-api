# =============================================================================
# ⚠️⚠️⚠️  本文件用 `pull_request_target` 触发 —— 这是 GitHub Actions 里最危险的
#         触发器。它以 **base 分支的 workflow 定义**运行,并且**能拿到仓库
#         secrets 与写权限的 token**,而 PR 可能来自任何人。
#
#         历史上绝大多数 pull_request_target 事故都是同一个形态:
#         「先 checkout 了 PR 的代码,然后在有 secrets 的上下文里跑了它」——
#         装依赖会执行 PR 的 lifecycle script,跑构建会执行 PR 的配置文件,
#         两者都等于把仓库交给提 PR 的人。
#
#         本文件因此有三条**不可删除**的禁令:
#           ① 绝不 checkout PR 代码(只 checkout base ref)
#           ② 绝不安装 PR 依赖(不跑 pnpm/npm/yarn install)
#           ③ 绝不执行 PR 内任何脚本(裁判脚本取自 base)
#         这三条由 scripts/harness-guards.selftest.ts 的 F3 断言逐条锁死
#         (剥注释后判,所以「注释里写了」不算数)。改这里之前先看那组断言。
#
# 它为什么必须存在(2026-07-29 跨模型评审 finding 2):
#   ci.yml 的 `Diff guards` 走 actions/checkout(PR 合并引用)→ pnpm install
#   (PR 的锁文件)→ tsx scripts/check-redzone.ts(**PR 自己提供的裁判**)。
#   PR 只要让 main() 输出 touched=false,红区审批就被跳过 —— 而 judge() 不动,
#   parity 自测照样全绿。自考自评的门不是门。`Diff guards` 保留作快速反馈,
#   **权威判定在本文件**。
#
# 本 workflow 承载两路 base-trusted 裁决,共用同一次 base checkout 与同一个
# harness-review 环境审批(架构治理 Phase 5 起):
#   ① 红区 / 执法层触碰         → redzone-trusted-judge.mjs → outputs.required
#   ② R14 授权语义降级 / 不可比 → authz-trusted-judge.mjs   → outputs.authzRequired
#   ③ R11 契约破坏性变更      → contract-trusted-judge.mjs → outputs.contractRequired
# 任一为 true 即要求维护者点批;verdict 对三路都要求明确的 true/false,空串一律拒绝。
# 合在这里而不新开 required context:新 context 会卡死所有 base 上没有它的在飞分支
# (本仓第五轮 harness 评审的既有教训)。也因此禁令①「checkout 只有一处」仍然成立。
# =============================================================================
name: Red-zone (trusted)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# 最小权限:只读。本 workflow 不写任何东西,只输出一个裁决。
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: redzone-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Red-zone trusted scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.judge.outputs.required }}
      authzRequired: ${{ steps.authz.outputs.authzRequired }}
      contractRequired: ${{ steps.contract.outputs.contractRequired }}
    steps:
      # 禁令①:ref 写死 base_ref。**绝不**用 github.event.pull_request.head.*,
      # 也不用默认的 merge ref —— 那两者都会把 PR 的代码放进这个有 secrets 的进程。
      # persist-credentials: false —— 不给后续步骤留下可用的 git 凭据。
      - name: Checkout BASE branch only (never the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      # 只装 Node 运行时,不碰仓库依赖(禁令②)。
      # 需要 ≥22.5:裁判用 path.matchesGlob(内置 glob,免依赖)。
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 禁令③:跑的是 base checkout 里的裁判脚本,不是 PR 里的。
      # 变更清单走 GitHub API(gh 是 runner 自带的),不信任 PR 的 git 历史。
      - name: Judge changed files against BASE red-zone registry
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/workflows/redzone-trusted-judge.mjs

      # R14 授权语义门(架构治理 Phase 5)。寄生在**同一个 job** 里,不是因为省事,
      # 而是因为禁令①要求「checkout 只有一处」—— 另开 job 就要第二次 checkout。
      #
      # 同样跑 base 的代码:比较器 scripts/authz-semantic-diff.ts、蕴含图、权限码全集
      # 全部来自上面那次 base checkout;PR 只贡献**数据**(head 的 manifest 与 fragment),
      # 而数据只被解码写盘再 JSON/markdown 解析,不 import、不执行。
      #
      # 比较器是 .ts 却不需要装依赖:它写成 erasable-syntax-only,用 Node 内置的
      # --experimental-strip-types 跑。这样本地(tsx)与裁判(裸 node)**共用同一份判据**,
      # 不产生第二套语义 —— `parity≠correctness` 是本仓已记录的教训。
      - name: Judge authorization semantic diff against BASE comparator
        id: authz
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/workflows/authz-trusted-judge.mjs

      # R11 契约语义门(Phase 5 刀 5-2)。与 authz 那步同构、同一次 base checkout。
      # 差异只有一处:openapi.json 约 3.8MB,超过 contents API 的 1MB 上限,
      # 所以裁判改用变更清单里 API 给出的 raw_url 取 head 版本(仍不是自己拼的 URL)。
      - name: Judge contract semantic diff against BASE comparator
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/workflows/contract-trusted-judge.mjs

  # 触碰受保护路径时才跑:harness-review 环境上挂了 required reviewer,
  # 本 job 会一直 pending 直到维护者在 PR 页面点批准。
  #
  # ⚠️ 与 ci.yml 里那个同名机制一样,它是**摩擦与留痕**,不是不可伪造的授权:
  #    本仓 AI 用的就是维护者本人的 token,GitHub 侧任何门在协议上都分不清
  #    「人点的」和「AI 拿人的 token 点的」。真正不可绕过的一步,只能是维护者
  #    合并前亲自看一眼被标红的 PR。
  approval:
    name: Red-zone trusted approval
    needs: scan
    if: needs.scan.outputs.required == 'true' || needs.scan.outputs.authzRequired == 'true' || needs.scan.outputs.contractRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: harness-review
    steps:
      - name: Record approval
        run: echo "✓ 维护者已在 harness-review 环境批准本次红区/执法层改动(trusted 裁判)"

  # 保名 gate:branch protection 的 required context 逐字指向本 job 的 name。
  # 判法与 ci.yml 的 gate 同源 —— **不从 skipped 反推**:approval 被跳过的唯一
  # 合法理由必须是 scan 明确报告 required=false。scan 自己失败时 required 会是
  # 空串或 'true'(fail-closed),那不是「没触碰」,是「没查出来」。
  verdict:
    name: Red-zone (trusted)
    needs: [scan, approval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate (fail-closed)
        run: |
          scan='${{ needs.scan.result }}'
          required='${{ needs.scan.outputs.required }}'
          authz_required='${{ needs.scan.outputs.authzRequired }}'
          contract_required='${{ needs.scan.outputs.contractRequired }}'
          approval='${{ needs.approval.result }}'
          echo "scan=$scan required=$required authz_required=$authz_required contract_required=$contract_required approval=$approval"
          if [ "$scan" != "success" ]; then
            echo "::error::trusted 裁判未成功($scan)—— 无法确认是否触碰红区 / 是否降级授权,拒绝放行"
            exit 1
          fi
          # 两路裁决都必须是明确的 true/false。空串 = 那一路没跑到 / 没给结论,
          # 那是「没查出来」,不是「没触碰」—— 与 required 单路时的判法逐字同源(INC-07)。
          for verdict in "$required" "$authz_required" "$contract_required"; do
            case "$verdict" in
              true|false) ;;
              *)
                echo "::error::裁判未给出明确结论(required='$required' authzRequired='$authz_required' contractRequired='$contract_required')—— 无法验证 ≠ 通过,拒绝放行"
                exit 1
                ;;
            esac
          done
          if [ "$required" = 'true' ] || [ "$authz_required" = 'true' ] || [ "$contract_required" = 'true' ]; then
            need_approval=true
          else
            need_approval=false
          fi
          case "$need_approval" in
            false)
              if [ "$approval" != "skipped" ]; then
                echo "::error::未触碰红区且无授权降级,却跑了审批 job($approval)—— 与裁决不一致,拒绝放行"
                exit 1
              fi
              echo "✓ 未触碰红区/执法层,且无授权降级/不可比端点,无需审批"
              ;;
            true)
              if [ "$approval" != "success" ]; then
                echo "::error::本次触碰红区/执法层或降级了授权,但 harness-review 审批未通过($approval)—— 拒绝放行"
                echo "::error::维护者需在本 PR 的 Red-zone trusted approval job 上点 Review deployments → Approve"
                echo "::error::(触碰红区 required=$required · 授权降级/不可比 authzRequired=$authz_required · 契约破坏 contractRequired=$contract_required)"
                exit 1
              fi
              echo "✓ 红区改动 / 授权语义变更已由维护者批准(trusted 裁判)"
              ;;
          esac
