name: Nightly E2E leaks

# Harness 3.0 P1:句柄泄漏检测串行线。
#
# 背景:jest 30 的 detectOpenHandles 强制 runInBand,与 e2e 并行化互斥,已从
# jest-e2e.config.ts 移除。它承担的「倒逼 afterAll app.close()」纪律由**两条线**承接:
#   ① 每 PR:ci.yml 的并行 e2e 步骤 grep 'failed to exit gracefully'
#      (并行模式泄漏时 jest 强杀 worker 并打这条,**退出码仍为 0**)
#   ② 每夜:本 workflow 串行 + detectOpenHandles,拿到**逐句柄的堆栈定位**
#
# ⚠️ 两种模式的文案完全不同(已实测确认,勿混用):
#   - 串行 + detectOpenHandles → 'Jest has detected the following N open handle...' + 堆栈,
#     且进程**挂住不退出**(没有 worker 可强杀)→ 必须用 timeout 兜底,否则只会以
#     job 超时的形式变红,看不出是泄漏。
#   - 并行 worker 模式     → 'A worker process has failed to exit gracefully...',退出码 0。
# 两条 grep 字符串由 scripts/harness-guards.selftest.ts 断言守护,防止再次写成对方的文案。
#
# 不加入 branch protection required checks:夜间跑,不阻塞 PR;失败通过 workflow
# 失败通知维护者,修复走常规 B/C 档 PR。

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 北京 02:00
  workflow_dispatch: {}

env:
  APP_ENV: test
  APP_PORT: '3001'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public&connection_limit=5&pool_timeout=20
  APP_CORS_ORIGIN: http://localhost:5173
  ENABLE_SWAGGER: 'true'
  JWT_SECRET: test-secret-please-keep-this-string-long-enough-32-chars
  JWT_EXPIRES_IN: 1h
  SUPER_ADMIN_USERNAME: admin
  SUPER_ADMIN_PASSWORD: ChangeMe123456
  SUPER_ADMIN_EMAIL: ''

jobs:
  e2e-leaks:
    name: E2E serial + detectOpenHandles
    runs-on: ubuntu-latest
    # 串行基线随 spec 数增长,须与内层 timeout 一起复核(见下方 Run E2E 步骤的注释)。
    # 恒保持 job timeout > 内层 timeout,否则内层的「超时/泄漏」判别拿不到执行机会。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL 16 service container
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL ready
        run: |
          for i in $(seq 1 60); do
            if docker exec u-nest-api-postgres pg_isready -U postgres -d app >/dev/null 2>&1; then
              echo "PostgreSQL is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL not ready after 60s"; docker compose logs postgres; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Initialize test database
        run: pnpm db:test:init

      # 串行全量 e2e + 句柄泄漏检测(**权威泄漏判据**)。
      #
      # 时长基线(随 spec 数增长,**改 timeout 前先看实测**):
      #   2026-07-28  195 spec  本机 1641s ≈ 27.4 分钟,195/195 绿、零句柄报告
      #   2026-08-08  264 spec  CI 首次撞 45m 上限
      #   2026-08-16  279 spec  内层放宽到 75m(job 90m)
      #
      # ⚠️ 2026-08-16 事故:08-08→08-15 连红 6 天,被读成「句柄泄漏」,实为**套件长胖跑不完**
      # (spec 195→264,压线抖动导致 08-09 还回绿过一次)。根因不在测试代码,在**判据把两种
      # 失败合并成了一条消息**。故本步骤下面把两者拆开判、拆开报:
      #   - jest 打了汇总行(`Test Suites:`)却仍被 timeout 杀 ⇒ **跑完了但进程不退出 = 真泄漏**
      #   - 没有汇总行就被杀             ⇒ **没跑完 = 时长不够**,该调 timeout 或分片,不是找泄漏
      # 两条路径的处置完全相反,合并报会把人带向错误方向(实测已浪费一轮排查)。
      - name: Run E2E (serial + detectOpenHandles; open handle = failure)
        run: |
          set +e
          mkdir -p tmp
          started=$(date +%s)
          timeout --signal=TERM --kill-after=60s 75m pnpm test:e2e:leaks > tmp/leaks.log 2>&1
          rc=$?
          set -e
          elapsed=$(( $(date +%s) - started ))
          tail -200 tmp/leaks.log
          # 时长恒可见:趋势是「该调 timeout / 该分片」的唯一先行指标,别等撞线才发现。
          echo "串行 e2e 用时 ${elapsed}s ≈ $(( elapsed / 60 ))分$(( elapsed % 60 ))秒(内层上限 75m = 4500s)"

          # ① 真泄漏:jest 打出了逐句柄堆栈。与是否超时无关,恒优先判。
          if grep -q 'Jest has detected the following' tmp/leaks.log; then
            echo "::error::检测到未关闭句柄(某 spec 的 afterAll 缺 app.close()?句柄堆栈见上方 jest 输出)"
            exit 1
          fi

          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            # 超时的两种死法靠「jest 有没有打汇总行」判别 —— 处置相反,不可合并成一条消息。
            if grep -qE '^(Test Suites|Tests):' tmp/leaks.log; then
              echo "::error::套件已跑完(有汇总行)但进程 75m 内未退出 ⇒ 句柄泄漏且 jest 未能打出堆栈。查最后完成的 spec 的 afterAll。"
            else
              echo "::error::套件在 75m 内未跑完(无汇总行)⇒ 这是**时长不足**不是泄漏。处置:调高本步骤 timeout 与 job timeout-minutes,或把串行线分片。勿按泄漏排查。"
            fi
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::串行 e2e 失败(exit $rc),详见上方输出"
            exit "$rc"
          fi
          echo "✓ 无句柄泄漏(用时 ${elapsed}s)"
