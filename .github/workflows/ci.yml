name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public test fixture values; never production credentials.
env:
  APP_ENV: test
  APP_PORT: '3001'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public&connection_limit=5&pool_timeout=20
  APP_CORS_ORIGIN: http://localhost:5173
  ENABLE_SWAGGER: 'true'
  JWT_SECRET: test-secret-please-keep-this-string-long-enough-32-chars
  JWT_EXPIRES_IN: 1h
  SUPER_ADMIN_USERNAME: admin
  SUPER_ADMIN_PASSWORD: ChangeMe123456
  SUPER_ADMIN_EMAIL: ''

jobs:
  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A missing/invalid base falls back to the full pipeline.
          docs_only=false
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            export BASE
            docs_only=$(python3 - <<'PY'
          import os, subprocess
          files = subprocess.check_output(
              ['git', 'diff', '--name-only', '--no-renames', '-z', os.environ['BASE'], 'HEAD']
          ).split(b'\0')
          files = [f for f in files if f]
          print('true' if files and all(f.endswith(b'.md') for f in files) else 'false')
          PY
          )
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changeset
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Cold lint
        if: needs.changeset.outputs.docs_only != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm lint
      - name: Typecheck
        if: needs.changeset.outputs.docs_only != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck
      - name: API artifacts and authorization declarations
        run: pnpm docs:openapi:check && pnpm docs:feclient:check && pnpm docs:authz:check
      - name: RBAC code invariants
        run: pnpm check:rbac
      - name: Build
        if: needs.changeset.outputs.docs_only != 'true'
        run: pnpm build
      # Some business specs consume Markdown fixtures, so units also run for docs.
      - name: Unit tests
        run: pnpm test
      - name: E4 historical prefix offline regression
        if: needs.changeset.outputs.docs_only != 'true'
        run: >-
          pnpm exec jest --config test/jest-unit.config.ts --runInBand
          --testRegex 'test/helpers/e4-migration-prefix\.spec\.ts$'
          --runTestsByPath test/helpers/e4-migration-prefix.spec.ts

  slow:
    name: Contract + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changeset
    if: needs.changeset.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      JEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 60); do
            if docker exec u-nest-api-postgres pg_isready -U postgres -d app >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker compose logs postgres
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm db:test:init
      - name: Install sealed R5 CI roles and verify default refusal
        run: |
          test "$GITHUB_ACTIONS" = true
          docker exec -i u-nest-api-postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d app_test < test/fixtures/r5-ci-sealed-roles.sql
          pnpm prisma:deploy
          docker exec -i u-nest-api-postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d app_test < test/fixtures/r5-ci-default-closed.sql
      - name: Verify production migration command on test database
        if: matrix.shard == 1
        run: pnpm prisma:deploy
      - name: Contract tests
        if: matrix.shard == 1
        run: pnpm test:contract
      - name: E2E tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp
          echo '::notice::Native launch scope: 500 identities / 2500 slices / 2000 units. Historical 2000-identity E4 capacity is NOT_VALIDATED; explicit manual/diagnostic positive selection only. Default and nightly E2E keep every other applicable test.'
          pnpm test:e2e --shard=${{ matrix.shard }}/5 2>&1 | tee tmp/e2e.log
          if grep -q 'failed to exit gracefully' tmp/e2e.log; then
            echo "::warning::Jest worker did not exit gracefully; inspect app.close(). Leak detection remains in nightly-e2e-leaks.yml."
          fi

  r5-human-ci:
    name: Authenticated Human V3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changeset
    if: needs.changeset.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Pull pinned isolated fixture images
        run: |
          docker pull postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          docker pull node@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
      - name: Real SCRAM qualification and current V3 regressions
        run: |
          test "$GITHUB_ACTIONS" = true
          mkdir -p tmp/r5-authenticated-ci
          python3 - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json
          started = datetime.now(timezone.utc)
          path = Path('tmp/r5-authenticated-ci/campaign.json')
          with path.open('x') as out:
              json.dump({'startedAt': started.isoformat(), 'deadline': (started + timedelta(seconds=1800)).isoformat()}, out)
          PYCODE
          python3 test/helpers/r5-ci-authentication.py --checkout "$GITHUB_WORKSPACE" --evidence "$GITHUB_WORKSPACE/tmp/r5-authenticated-ci/run" --campaign "$GITHUB_WORKSPACE/tmp/r5-authenticated-ci/campaign.json" --regressions
      - name: Preserve bounded fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-authenticated-ci-${{ github.run_attempt }}
          path: tmp/r5-authenticated-ci/
          retention-days: 7

  journeys:
    name: Golden journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changeset
    if: needs.changeset.outputs.docs_only != 'true'
    env:
      JEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 60); do
            if docker exec u-nest-api-postgres pg_isready -U postgres -d app >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker compose logs postgres
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm db:test:init
      - name: Install sealed R5 CI roles and verify default refusal
        run: |
          test "$GITHUB_ACTIONS" = true
          docker exec -i u-nest-api-postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d app_test < test/fixtures/r5-ci-sealed-roles.sql
          pnpm prisma:deploy
          docker exec -i u-nest-api-postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d app_test < test/fixtures/r5-ci-default-closed.sql
      - run: pnpm test:journeys

  redzone-scan:
    name: Diff guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report protected paths (approval is in the trusted workflow)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$BASE" HEAD
          node .github/workflows/redzone-trusted-judge.mjs --local "$BASE"

  gate:
    # Required check names must stay unchanged.
    name: Lint / Typecheck / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changeset, fast, slow, journeys, r5-human-ci, redzone-scan]
    if: always()
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module - <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          for (const key of ['changeset', 'fast', 'redzone-scan']) {
            if (results[key]?.result !== 'success') throw new Error(`${key} did not succeed`);
          }
          const docsOnly = results.changeset.outputs.docs_only === 'true';
          for (const key of ['slow', 'journeys', 'r5-human-ci']) {
            const result = results[key]?.result;
            if (result !== 'success' && !(docsOnly && result === 'skipped')) {
              throw new Error(`${key}: ${result}`);
            }
          }
          JS

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t u-nest-api-starter:ci .
